<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Email verified</title>
<style>
  :root {
    --bg: #f4f7f5;
    --ink: #13201a;
    --muted: #55645c;
    --accent: #1b9b68;
    --accent-soft: rgba(27, 155, 104, 0.14);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1713;
      --ink: #eef5f1;
      --muted: #9aaba1;
      --accent: #3ccf93;
      --accent-soft: rgba(60, 207, 147, 0.16);
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
  }
  main { max-width: 360px; }

  .badge {
    position: relative;
    width: 112px;
    height: 112px;
    margin: 0 auto 32px;
  }
  .badge::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: var(--accent-soft);
    transform: scale(0.6);
    opacity: 0;
    animation: bloom 0.9s ease-out 1.1s forwards;
  }
  svg { position: relative; width: 100%; height: 100%; overflow: visible; }
  svg circle, svg path {
    fill: none;
    stroke: var(--accent);
    stroke-width: 5;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .ring {
    stroke-dasharray: 289;
    stroke-dashoffset: 289;
    transform: rotate(-90deg);
    transform-origin: 50% 50%;
    animation: draw 0.8s cubic-bezier(.6,.1,.2,1) 0.2s forwards;
  }
  .tick {
    stroke-dasharray: 60;
    stroke-dashoffset: 60;
    animation: draw 0.45s ease-out 0.95s forwards;
  }

  h1 {
    margin: 0 0 10px;
    font-size: 1.75rem;
    font-weight: 650;
    letter-spacing: -0.02em;
    opacity: 0;
    animation: rise 0.6s ease-out 1.35s forwards;
  }
  p {
    margin: 0;
    font-size: 1.05rem;
    line-height: 1.55;
    color: var(--muted);
    opacity: 0;
    animation: rise 0.6s ease-out 1.55s forwards;
  }

  @keyframes draw  { to { stroke-dashoffset: 0; } }
  @keyframes bloom { to { transform: scale(1.35); opacity: 0; } }
  @keyframes rise  { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before { animation-duration: 0.01s !important; animation-delay: 0s !important; }
  }
</style>
</head>
<body>
  <main>
    <div class="badge" aria-hidden="true">
      <svg viewBox="0 0 100 100">
        <circle class="ring" cx="50" cy="50" r="46"/>
        <path class="tick" d="M30 52 L44 66 L71 36"/>
      </svg>
    </div>
    <h1>Email verified</h1>
    <p>Your account is ready. You can close this page and log in from the app.</p>
  </main>
</body>
</html>
